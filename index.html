<!DOCTYPE html>
<html>

<head>
    <title>applications</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
            background-color: puple;
        }

        button {
            font-size: 24px;
            padding: 18px;
            margin: 6px;
            background-color: puple;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "break thourgh" mean?</p>

    <button onclick="checkAnswer('break through')">
        break through
    </button>

    <button onclick="checkAnswer('avoid')">
        Avoid
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "break through") {
                document.getElementById("feedback").innerText =
                    "Correct! Well done!,정답을 맞추셨습니다!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "Incorrect. The answer is Participate in.,완전 BABO!";
            }

        }

    </script>

</body>
</html>
